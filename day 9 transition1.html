<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        .parent{

            height:400px;
            width:800px;
            border:2px solid red;
        }
        .child{
            height:100px;
            width:100px;
            background-color: brown;
            transition:all 2s linear;
        }

        .parent:hover .child{

            width:100px;
            /* margin-left:700px; */
            background-color: orange;
            border:4px solid blue;
            /* border-radius:50%; */
            transform:rotate(360deg);
            transform:scale(2);
            transform:skew(40deg,20deg);
            transform:translate(50px,100px);
        }
        .cont{
            height:150px;
            width:300px;
            outline:3px solid black;
            border:2px solid red;
            outline-offset:50px;
            transition:all 2s linear;
            margin-top:200px;
            margin-left: 200px;
        }

        .cont:hover{
            transform:rotate(360deg);
            transform:scale(2);
        }
    </style>
</head>
<body>
    


    <div  class="parent">

        <div class="child">

        </div>


    </div>

    <div class="cont">

        welcome to cncwelcome to cnc  
        welcome to cncwelcome to cnc  
        welcome to cncwelcome to cnc   
    </div>
</body>
</html>
