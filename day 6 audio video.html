<html>

<head>
    <title>document</title>
    <style>
        *{
        margin:0px;
    }
    header{
        width: 100%;
        height: 150px;
        background:rgb(181, 173, 174);
    }
    h1{
        color: black;
        padding: 4%;
    }
    audio{
        padding-top: 40px;
        padding-left: 30px;
    }
    video{
        width: 600px;
        padding-left: 30px;
        padding-top: 30px;
    }
    iframe{
        padding-left: 30px;
        padding-top: 30px;
    }

    </style>
</head>
<body>
    <header>
        <h1>HTML5</h1>
    </header>
    <section>
        <h2 style="padding-top: 50px; padding-left: 30px;">Audio</h2>
        <audio controls >
            <source src="audio.mp3" title="audio"/>
        </audio>

        <br></br>
        <h2 style="padding-left: 30px;padding-top: 30px;">Video</h2>
        <video controls autoplay loop>
            <source src="video.mp4" title="video"/>
        </video>

        <br></br>
        <h2 style="padding-top: 50px; padding-left: 30px;">Google Map</h2>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d4090.902364600483!2d73.0178024!3d19.033628399999998!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3be7c3c20d34a785%3A0x813bca6aabd7e658!2sCNC%20WEB%20WORLD!5e1!3m2!1sen!2sin!4v1780567061734!5m2!1sen!2sin" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        <br></br>
        <h2 style="padding-top: 50px; padding-left: 30px;">YouTube</h2>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/27YBy2mHVgw?si=65N77I7KTcNURo1T" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </section>
</body>

</html>
