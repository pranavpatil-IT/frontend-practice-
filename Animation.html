<html>
    <head>
        <title>animation</title>
        <style>
            *{
                margin: 0px;
                padding: 0px;
            }
            .parent{
                background-color: grey;
                height: 500px;
                width: 500px;
                position: relative;
                margin-left: 500px;
                margin-top: 100px;
            }
            .child{
                background-color: rgb(26, 25, 25);
                height: 100px;
                width: 100px;
                position:absolute;
                animation:myani 5s 2 linear;
            }
            @keyframes myani{
                0%{
                    top:0px;
                    left: 0px;
                }
                25%{
                    top: 0px;
                    left: 400px;
                    background-color: pink;
                }
                50%{
                    top: 400px;
                    left: 400px;
                    background-color: red;
                }
                75%{
                    top: 400px;
                    left:0px;
                    background-color: yellow;
                }
                100%{
                    top: 0px;
                    left: 0px;
                }
            }
        </style>
    </head>
    <body>
        <div class="parent">

            <div class="child">

            </div>
        </div>
    </body>
</html>
