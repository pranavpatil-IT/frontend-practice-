<html>
    <title>
        list
    </title>
    <body>
        <h1>ordered list</h1>
        <ol>
            <li>mobile
                <ol type="a">
                <li>iphone </li>
                <li>vivo</li>
                <li>samsung</li>
                </ol>
            </li>
        </ol>

        <h1>unordered list</h1>
        <ul type="square">
            <li>iphone 11
                <ul type="circle">
                    <li>iphone 11 pro</li>
                </ul>
            </li>
            <li>iphone 12</li>
            <li>iphone 13</li>
        </ul> 
 
         <h1>nested list</h1>

        <ul type="square">
            <li>tv brands
                <ul>
                    <li>samsung
                        <ol type="i">
                            <li>price=20000 </li>
                        </ol>
                    </li>
                    <li>sony
                        <ol type="i">
                            <li>price=18000</li>
                        </ol>
                    </li>
                    <li>vu
                        <ol type="i">
                            <li>price=19000</li>
                        </ol>
                    </li>
                </ul>
            </li>

        </ul>
    </body>
</html>
